services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pembantu
      POSTGRES_PASSWORD: pembantu
      POSTGRES_DB: pembantu
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pembantu"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://pembantu:pembantu@db:5432/pembantu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
